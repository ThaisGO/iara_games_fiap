<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/build/index.css" />

    <title>Iara Games - Em Breve</title>
</head>

<body class="bg-surface">
    <div class="h-screen flex flex-col">
        <div class="bg-pattern-indigena w-full min-h-16 border-b-medium border-line py-3"></div>

        <main class="flex flex-1 flex-col items-center justify-center gap-6 text-center py-5">
            <div>
                <img class="max-h-75 w-full" src="public/assets/em-breve.png" alt="" />
            </div>
            <div>
                <span
                    class="self-start inline-flex items-center bg-action-secondary-default/24 border border-dark text-title-secondary body-semibold-xs py-1 px-3 rounded-full uppercase">
                    Em breve
                </span>
            </div>
            <div>
                <h1 class="headlines-h1 text-title uppercase">
                    Estamos construindo algo
                    <span class="text-brand-green-400">incrível</span>
                </h1>
            </div>

            <div class="max-w-md">
                <p class="body-regular-lg text-body">
                    Estamos preparando algo especial para você. Esta seção ainda está
                    sendo construída — volte em breve para conferir as novidades.
                </p>
            </div>

            <div class="mt-2">
                <a class="self-start inline-flex items-center gap-2 rounded-xl bg-brand-yellow-400 px-6 py-3.5 body-extrabold-sm uppercase tracking-wide text-surface transition-colors hover:bg-brand-yellow-500 active:bg-brand-yellow-600"
                    href="index.html">
                    <span class="icon-[custom--arrow-left] size-5"></span>
                    voltar ao inicio
                </a>
            </div>
        </main>

        <div class="bg-pattern-indigena w-full min-h-16 border-t-medium border-line py-3"></div>

</html>
